name: n0ai daily ingest
on:
  schedule:
    - cron: '0 23,11 * * *' # 06:00 & 18:00 ICT
  workflow_dispatch:
    inputs:
      limit:
        description: 'So bai moi loai'
        default: '6'
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          INGEST_LIMIT: ${{ inputs.limit || '6' }}
        run: node scripts/ingest.mjs
      - name: Build
        run: npm run build
      - name: Commit & Push
        run: |
          git config user.name "n0ai-bot"
          git config user.email "bot@n0ai.cloud"
          git add src/content/blog src/content/news
          git diff --cached --quiet || git commit -m "chore: auto ingest $(date -u +%Y-%m-%d)"
          git push
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/client --project-name=n0ai-news-blog --commit-dirty=true
